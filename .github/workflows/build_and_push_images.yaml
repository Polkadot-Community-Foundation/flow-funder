name: Build and Push Image

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation (GAR auth)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: flow-funder
  # Private Google Artifact Registry — pcf-infra (ArgoCD) pulls from here. The GAR
  # repo + WIF binding are provisioned in pcf-infra terraform/flow-funder-artifact-registry.tf.
  GAR_REGISTRY: us-docker.pkg.dev/polkadot-community-foundation/flow-funder

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag (date-shortsha)
        id: ver
        run: echo "version=$(date -u '+%Y%m%d-%H%M%S')-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # GAR auth via Workload Identity Federation. Only on push (PRs just build, no
      # push, so they need no GCP credentials). Repo secrets GCP_SA_GITHUB /
      # GCP_WIP_GITHUB come from the terraform outputs (see pcf-infra).
      - name: Set up gcloud
        if: github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate to Google Artifact Registry
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v3
        with:
          service_account: ${{ secrets.GCP_SA_GITHUB }}
          workload_identity_provider: ${{ secrets.GCP_WIP_GITHUB }}

      - name: Configure Docker for GAR
        if: github.event_name == 'push'
        run: gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.GAR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.GAR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
