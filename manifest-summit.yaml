images:
  bot:
    env:
      # Asset Hub reserve_name MUST be the w3s-dotnsgateway-workaround (7-arg) variant.
      # See README "Asset Hub runtime prerequisite". On the standard 6-arg pallet the
      # bot connects but every reservation fails to encode.
      PEOPLE_NODE_URL: wss://summit-people-rpc.polkadot.io
      ASSET_HUB_NODE_URL: wss://summit-asset-hub-rpc.polkadot.io
      RESERVER_PROXY_FOR: ref+vault://kv/flow-funder/summit#reserver-proxy-for
      RESERVER_SEED_PHRASE: ref+vault://kv/flow-funder/summit#reserver-seed-phrase
      RESERVER_DERIVATION_PATH: ref+vault://kv/flow-funder/summit#reserver-derivation-path
      RESERVER_BATCH_SIZE: "3"
      RESERVER_MAX_SUBMIT_RETRIES: "3"
      RESERVER_SCAN_WINDOW_BLOCKS: "500"
      RESERVER_CURSOR_FILE: /data/flow-funder-cursor.txt
      RESERVER_DRY_RUN: "false"
      RESERVER_HEALTH_PORT: "3033"
      RESERVER_HEALTH_BIND: 0.0.0.0
      RUST_LOG: flow_funder=info
